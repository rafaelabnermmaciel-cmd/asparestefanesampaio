<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equipe de Rua — Estéfane Sampaio</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (window.tailwind) {
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  }
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">

<div id="aviso-config" class="hidden border-b border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800 dark:border-amber-900 dark:bg-amber-950/40 dark:text-amber-300">
  ⚠️ Supabase ainda não configurado. Edite <code class="rounded bg-amber-100 px-1 py-0.5 dark:bg-amber-900/50">equipe-rua/js/supabase-config.js</code> com os dados do seu projeto — veja <code class="rounded bg-amber-100 px-1 py-0.5 dark:bg-amber-900/50">SETUP.md</code>.
</div>

<div class="flex min-h-screen">
  <!-- Sidebar (desktop) -->
  <aside class="hidden w-64 shrink-0 flex-col border-r border-slate-200 bg-white/80 px-4 py-6 backdrop-blur lg:flex dark:border-slate-800 dark:bg-slate-950/80 print:hidden">
    <div class="mb-8 flex items-center gap-2.5 px-2">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-indigo-600 text-white">
        <i data-lucide="footprints" class="h-5 w-5"></i>
      </div>
      <div>
        <p class="text-sm font-semibold text-slate-900 dark:text-white">Equipe de Rua</p>
        <p class="text-[11px] text-slate-400">Estéfane Sampaio · DF</p>
      </div>
    </div>
    <nav class="flex flex-1 flex-col gap-1" id="nav-desktop"></nav>
    <div class="mt-auto flex flex-col gap-3 px-2">
      <button id="btn-theme" class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-600 shadow-sm transition hover:border-slate-300 hover:text-slate-900 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-slate-700 dark:hover:text-white">
        <i data-lucide="moon" class="h-4 w-4"></i>
        <span id="theme-label">Escuro</span>
      </button>
      <p class="text-[11px] leading-relaxed text-slate-400">Panfletagem, reuniões/café, paredão e eventos nas RAs · sync em tempo real via Supabase.</p>
    </div>
  </aside>

  <!-- Conteúdo -->
  <div class="flex min-h-screen flex-1 flex-col pb-16 lg:pb-0">
    <!-- Topbar: contador do dia -->
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 px-4 py-3 backdrop-blur sm:px-6 dark:border-slate-800 dark:bg-slate-950/90 print:hidden">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 id="titulo-pagina" class="text-lg font-semibold text-slate-900 dark:text-white">Resumo do dia</h1>
          <p id="subtitulo-pagina" class="text-xs text-slate-400"></p>
        </div>
        <div class="flex items-center gap-3">
          <div class="rounded-2xl border border-slate-200 bg-white px-4 py-2 text-center shadow-sm dark:border-slate-800 dark:bg-slate-900">
            <p class="text-[10px] font-medium uppercase tracking-wide text-slate-400">Contratados</p>
            <p id="contador-contratados" class="text-xl font-semibold text-slate-900 dark:text-white">—</p>
          </div>
          <div class="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-2 text-center shadow-sm dark:border-emerald-900 dark:bg-emerald-500/10">
            <p class="text-[10px] font-medium uppercase tracking-wide text-emerald-600 dark:text-emerald-400">Na rua hoje</p>
            <p id="contador-na-rua" class="text-xl font-semibold text-emerald-600 dark:text-emerald-400">—</p>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 px-4 py-6 sm:px-6">
      <!-- Página: Dashboard / Resumo do dia -->
      <section id="page-dashboard" class="page space-y-6"></section>

      <!-- Página: Agenda diária -->
      <section id="page-agenda" class="page hidden space-y-6"></section>

      <!-- Página: Pessoas -->
      <section id="page-pessoas" class="page hidden space-y-6"></section>

      <!-- Página: Localidades -->
      <section id="page-localidades" class="page hidden space-y-6"></section>
    </main>
  </div>
</div>

<!-- Nav mobile -->
<nav id="nav-mobile" class="fixed inset-x-0 bottom-0 z-40 flex border-t border-slate-200 bg-white/95 backdrop-blur lg:hidden dark:border-slate-800 dark:bg-slate-950/95 print:hidden"></nav>

<!-- Modal genérico -->
<div id="modal-backdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/40 px-4 backdrop-blur-sm">
  <div id="modal-box" class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl dark:border-slate-800 dark:bg-slate-900"></div>
</div>

<!-- Toast simples -->
<div id="toast" class="fixed bottom-20 left-1/2 z-50 hidden -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-medium text-white shadow-lg lg:bottom-6 dark:bg-white dark:text-slate-900"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
